name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: Restore, build, and test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: dotnet
        run: dotnet restore FCR.slnx

      - name: Build
        working-directory: dotnet
        run: dotnet build FCR.slnx --configuration Release --no-restore

      - name: Test
        working-directory: dotnet
        run: dotnet test FCR.slnx --configuration Release --no-build --logger "trx;LogFileName=fcr-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
