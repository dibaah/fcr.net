name: CI / Build EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "2.0.0"

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Validate frontend HTML structure
        run: python tools/check_html.py static/index.html

  build:
    name: Build EXE
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.10.0"

      - name: Build with PyInstaller
        run: python -m PyInstaller FCR_Dashboard.spec --clean --noconfirm

      - name: Stage runtime files
        shell: pwsh
        run: |
          $dist = "dist/FCR_Dashboard"
          if (-not (Test-Path $dist)) {
            throw "Build output folder $dist is missing."
          }
          if (Test-Path "fcr_database.db") {
            Copy-Item -Path "fcr_database.db" -Destination "$dist/fcr_database.db" -Force
            Write-Host "Copied fcr_database.db"
          }
          if (-not (Test-Path "$dist/_internal/static")) {
            Copy-Item -Path "static" -Destination "$dist/static" -Recurse -Force
            Write-Host "Copied static folder"
          }
          Write-Host "Staged runtime files in $dist"

      - name: Package build into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FCR_Dashboard/*" -DestinationPath "FCR_Dashboard.zip" -Force
          $size = [math]::Round((Get-Item "FCR_Dashboard.zip").Length / 1MB, 2)
          Write-Host "ZIP size: $size MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCR_Dashboard-windows
          path: FCR_Dashboard.zip
          retention-days: 14
          if-no-files-found: error

      - name: Collect build metadata
        id: meta
        shell: pwsh
        run: |
          "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT
          "sha_short=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      - name: Delete previous 'latest' release
        if: github.ref_type != 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          name: "${{ github.ref_type == 'tag' && format('FCR Dashboard {0}', github.ref_name) || 'FCR Dashboard - Latest Build' }}"
          body: |
            ## FCR Dashboard - Windows build

            **Version:** ${{ github.ref_type == 'tag' && github.ref_name || env.APP_VERSION }}
            **Build date:** ${{ steps.meta.outputs.date }}
            **Commit:** `${{ steps.meta.outputs.sha_short }}`

            ### Installation
            1. Download `FCR_Dashboard.zip`
            2. Extract the archive to any folder, for example `C:\FCR_Dashboard\`
            3. Run `FCR_Dashboard.exe`

            ### Requirements
            - Windows 10 or 11
            - Microsoft Edge, pre-installed on Windows 10 and 11

            ### Author
            Farzad Meshkipour - SINOPEC International - YADAVARAN
          files: FCR_Dashboard.zip
          fail_on_unmatched_files: true
          prerelease: false
